# GitHub Actions 工作流：构建并发布 MusicTagClone（音乐标签）
#
# 功能：
#   1. 在 windows-latest 上编译 net10.0-windows 与 net461 两个目标框架（Release）
#   2. 运行离线单元测试（跳过 Category=Network / GUI，样本文件测试缺失时自动跳过）
#   3. 将两个目标框架的构建产物分别打包为 zip（剔除运行时数据 cache/、log/、MusicTagClone.db）
#   4. 上传为 workflow artifact；推 v* 标签时自动创建 GitHub Release 并附带两个 zip
#
# 说明：
#   - 产物直接取 bin/Release/<tfm>/ 构建输出（含 libs/ 与 x64/x86 原生库、runtimes/）。
#     不要用 dotnet publish —— publish 会把 libs/ 子目录结构拍平，破坏程序集加载。
#   - 打 v* 标签时用标签版本（去掉前导 v）覆盖程序集版本，帮助菜单显示的版本号与标签一致。

name: 构建并发布

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # gh release create 需要写 contents 权限（默认 GITHUB_TOKEN 是只读）

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # 打 v* 标签时解析出版本号（如 v0.9.0 → 0.9.0），用于覆盖程序集版本；分支/PR 构建为空
    - name: 解析发布版本
      id: version
      shell: pwsh
      run: |
        $ver = ''
        if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $ver = $Matches[1] }
        Write-Output "version=$ver" >> $env:GITHUB_OUTPUT

    - name: 编译解决方案（net10.0-windows + net461）
      shell: pwsh
      run: |
        $buildArgs = @()
        $ver = "${{ steps.version.outputs.version }}"
        if ($ver) { $buildArgs += "-p:Version=$ver" }
        dotnet build MusicTagClone.slnx -c Release @buildArgs

    - name: 运行离线单元测试（跳过联网与 GUI）
      shell: pwsh
      run: dotnet test tests/MusicTagClone.Tests/MusicTagClone.Tests.csproj -c Release --no-build --filter "Category!=Network&Category!=GUI"

    - name: 打包 net461
      shell: pwsh
      run: |
        $stage = 'dist-staging/net461'
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Copy-Item -Path 'src/MusicTagClone/bin/Release/net461/*' -Destination $stage -Recurse -Force
        Remove-Item -Recurse -Force "$stage/cache", "$stage/log", "$stage/MusicTagClone.db" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
        Compress-Archive -Path "$stage/*" -DestinationPath 'dist/MusicTagClone-net461.zip' -Force

    - name: 打包 net10.0-windows
      shell: pwsh
      run: |
        $stage = 'dist-staging/net10'
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Copy-Item -Path 'src/MusicTagClone/bin/Release/net10.0-windows/*' -Destination $stage -Recurse -Force
        Remove-Item -Recurse -Force "$stage/cache", "$stage/log", "$stage/MusicTagClone.db" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
        Compress-Archive -Path "$stage/*" -DestinationPath 'dist/MusicTagClone-net10.0-windows.zip' -Force

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: MusicTagClone-packages
        path: dist/*.zip
        if-no-files-found: error

    - name: 创建 GitHub Release（仅 v* 标签）
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes
